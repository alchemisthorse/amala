# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: amala
description: Amala Network

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos
        - bieszczaders/kernel-cachyos-addons
        - scottames/ghostty
    install:
      packages:
        - steam
        - mangohud
        - steam-devices
        - gamescope
        - kernel-cachyos
        - cachyos-settings
        - scx-scheds
        - scx-tools
        - scx-manager
        - ananicy-cpp
        - cachyos-ananicy-rules
        - fastfetch
        - distrobox
        - ghostty
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - zram-generator-defaults
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
        - toolbox                   
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.vysp3r.ProtonPlus
          - io.github.kolunmi.Bazaar
          - com.mattjakeman.ExtensionManager
          - org.prismlauncher.PrismLauncher
          - com.brave.Browser
          - io.github.DenysMb.Kontainer
          - org.gnome.TextEditor
          - io.github.radiolamp.mangojuice
          - net.lutris.Lutris
          
      - scope: user

  - type: signing
