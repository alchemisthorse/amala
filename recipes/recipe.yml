# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: amala
description: Amala Network

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
        - steam
        - mangohud
        - steam-devices
        - gamescope
        - gamemode
        - fastfetch
        - distrobox
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - toolbox
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - one.ablaze.floorp
          - com.vysp3r.ProtonPlus
          - io.github.kolunmi.Bazaar
          - org.prismlauncher.PrismLauncher
          - com.brave.Browser
          - io.github.DenysMb.Kontainer
          - io.github.radiolamp.mangojuice
          - net.lutris.Lutris
          - com.github.tchx84.Flatseal
          - org.kde.gwenview
          - org.videolan.VLC
          - org.kde.okular
  - type: signing
